# The Agentar-Scale-SQL selector: GRPO teaches a model to pick the correct query of two.
# Reward 1 for the right pick, 0 otherwise (the paper's R_S). Same GRPO recipe as the generator.
# Data: `datalens agent selector-data runs/agentar-3b-train` (see notebooks/colab_agent.ipynb).
# Fits one 40GB A100 with LoRA and vLLM colocated; on a 96GB G4 you can double the batch.
run_name: grpo-selector-qwen2.5-coder-3b
method: grpo
task: selection
model: Qwen/Qwen2.5-Coder-3B-Instruct   # the paper starts from Qwen2.5-Coder-32B-Instruct
output_dir: checkpoints/grpo-selector-qwen2.5-coder-3b

data:
  records_file: data/selector/bird-train-pairs.jsonl
  max_prompt_tokens: 6144      # longer prompts are dropped (light schema of big train databases)
  train_fraction: 1.0

lora:
  r: 32
  alpha: 64
  dropout: 0.0

export:
  merge_lora: false            # the agent loads the adapter; a merged copy would add ~6 GB on Drive
  hub_repo: null

trainer:                       # passed to trl.GRPOConfig
  max_steps: 400               # 400 steps x 8 prompts = 3,200 pairs (the paper builds 8.5k)
  learning_rate: 1.0e-5
  lr_scheduler_type: constant_with_warmup
  warmup_steps: 10
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 16  # 64 completions per step = 8 pairs x 8 rollouts
  num_generations: 8
  max_completion_length: 1024
  temperature: 1.0
  beta: 0.0
  loss_type: dapo
  epsilon_high: 0.28
  mask_truncated_completions: true
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.35
  vllm_max_model_length: 7424  # 6,144 prompt + 1,024 completion + room for the chat template
  bf16: true
  gradient_checkpointing: true
  logging_steps: 5
  save_steps: 50
  save_total_limit: 2
  log_completions: true
  num_completions_to_print: 2
  report_to: none
  model_init_kwargs:
    dtype: bfloat16
