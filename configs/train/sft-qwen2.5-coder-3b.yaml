# Supervised fine-tuning on BIRD train gold SQL (the SFT baseline).
# Fits one 40GB A100.
run_name: sft-qwen2.5-coder-3b
method: sft
model: Qwen/Qwen2.5-Coder-3B-Instruct
output_dir: checkpoints/sft-qwen2.5-coder-3b

data:
  data_root: data/bird
  benchmark: bird-train
  train_fraction: 1.0          # 0.1 / 0.25 / 0.5 for the learning curve
  max_prompt_tokens: 4096

prompt:
  reasoning: false             # SFT targets are bare SQL, so the prompt asks for SQL only
  num_examples: 3

lora:
  r: 32
  alpha: 64
  dropout: 0.05

export:
  merge_lora: true
  hub_repo: null               # e.g. your-user/datalens-qwen2.5-coder-3b-sft

trainer:                       # passed to trl.SFTConfig
  num_train_epochs: 2
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 8
  learning_rate: 1.0e-4
  lr_scheduler_type: cosine
  warmup_steps: 0.03            # a float below 1 is a fraction of all steps
  max_length: 4608
  bf16: true
  gradient_checkpointing: true
  logging_steps: 10
  save_strategy: epoch
  save_total_limit: 2
  report_to: none
  model_init_kwargs:
    dtype: bfloat16
