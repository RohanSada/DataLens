# Two ways to run:
#   GPU, your fine-tuned model:  docker compose --profile gpu up
#   No GPU, Claude as the model:  DATALENS_BACKEND=anthropic DATALENS_MODEL=claude-sonnet-5-5 \
#                                 ANTHROPIC_API_KEY=... docker compose up api
# Then open http://localhost:8000
services:
  vllm:
    profiles: ["gpu"]
    image: vllm/vllm-openai:latest   # pin a version for reproducible deployments
    command:
      - --model=${DATALENS_MODEL_PATH:-Qwen/Qwen2.5-Coder-7B-Instruct}
      - --served-model-name=datalens
      - --max-model-len=16384
      - --enable-prefix-caching
    ports: ["8001:8000"]
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
      - ./checkpoints:/checkpoints:ro   # e.g. DATALENS_MODEL_PATH=/checkpoints/grpo-qwen2.5-coder-7b/merged
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports: ["8000:8000"]
    environment:
      DATALENS_BACKEND: ${DATALENS_BACKEND:-openai}
      DATALENS_MODEL: ${DATALENS_MODEL:-datalens}
      DATALENS_BASE_URL: ${DATALENS_BASE_URL:-http://vllm:8000/v1}
      DATALENS_SAMPLES: ${DATALENS_SAMPLES:-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    # Mount your own SQLite files (db_id/db_id.sqlite or db_id.sqlite) here:
    # volumes:
    #   - ./data/bird/dev/dev_databases:/app/data/databases:ro
