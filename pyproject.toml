[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "datalens"
version = "0.2.0"
description = "Small open models trained with execution-reward RL (GRPO) vs. frontier LLMs on BIRD text-to-SQL."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Rohan Sada" }]
keywords = ["text-to-sql", "bird", "grpo", "reinforcement-learning", "llm", "evaluation"]
dependencies = [
    "sqlglot>=25.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
# Calling models: Claude and OpenAI-compatible servers (vLLM's `vllm serve`).
clients = ["anthropic>=1.11", "openai>=1.40"]
# The HTTP API and demo page.
serve = ["datalens[clients]", "fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic-settings>=2.2"]
# Evaluation reports and plots.
eval = ["datalens[clients]", "matplotlib>=3.8"]
# Fine-tuning (SFT and GRPO). Install a CUDA build of torch on GPU machines.
train = [
    "torch>=2.4",
    "transformers>=5.0",
    "trl>=1.0",
    "peft>=0.17",
    "datasets>=3.0",
    "accelerate>=1.0",
    # TRL's GRPO trainer imports requests but only declares it in its [vllm] extra.
    "requests>=2.31",
]
# Fast local generation for evaluation and GRPO rollouts (Linux + CUDA only).
# Installed through TRL so the vLLM version is one its GRPO trainer supports.
vllm = ["trl[vllm]>=1.0"]
dev = [
    "datalens[serve,eval]",
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML",
]

[project.scripts]
datalens = "datalens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/datalens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "smoke: trains a tiny randomly initialised model on CPU (needs the [train] extra)",
]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
plugins = ["pydantic.mypy"]
packages = ["datalens"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
